name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qt6:
    name: Qt 6 build, tests and package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libgl1-mesa-dev shellcheck

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DHEXCALC_WERROR=ON
          cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check installer
        run: shellcheck install.sh

      - name: Package
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          mkdir -p dist
          mv stage/usr dist/hex-calc-linux-x86_64
          cp install.sh README.md LICENSE dist/hex-calc-linux-x86_64/
          tar -C dist -czf hex-calc-linux-x86_64.tar.gz hex-calc-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: hex-calc-linux-x86_64
          path: hex-calc-linux-x86_64.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hex-calc-linux-x86_64.tar.gz
          generate_release_notes: true

  qt5:
    name: Qt 5 build and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qtbase5-dev

      - name: Build
        run: |
          cmake -S . -B build -DHEXCALC_QT=5 -DHEXCALC_WERROR=ON
          cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
